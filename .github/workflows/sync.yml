name: Atualização Diária de Matérias

on:
  schedule:
    # 09:00 UTC = 06:00 Horário de Brasília
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar Scraper
        run: |
          python scraper.py

      - name: Commit e Push dos Dados Atualizados
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add dados_materias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: atualização diária de tramitações [skip ci]" && git push)
