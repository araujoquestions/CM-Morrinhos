<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acompanhamento Legislativo - Câmara Municipal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-200 pb-6 gap-4">
      <div>
        <span class="text-xs font-semibold tracking-wider text-blue-700 uppercase">Câmara Municipal</span>
        <h1 class="text-2xl font-bold text-slate-900">Painel de Tramitação de Matérias</h1>
      </div>
      <div id="sync-info" class="text-xs text-slate-500 bg-white border border-slate-200 px-3 py-2 rounded-lg shadow-sm">
        Carregando status de sincronização...
      </div>
    </header>

    <!-- Filtros de Busca -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-3">
      <input type="text" id="busca" placeholder="Buscar por número, ementa ou autor..." 
             class="flex-1 px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <select id="filtro-status" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Todos os Status</option>
        <option value="Aprovado">Aprovado</option>
        <option value="Em tramitação">Em tramitação</option>
        <option value="Comissão">Nas Comissões</option>
      </select>
    </div>

    <!-- Lista de Matérias -->
    <div id="lista-materias" class="space-y-4">
      <div class="text-center py-12 text-slate-400">Carregando proposituras...</div>
    </div>
  </div>

  <script>
    let todasMaterias = [];

    async function carregarDados() {
      try {
        const res = await fetch('dados_materias.json');
        const data = await res.json();
        todasMaterias = data.materias || [];
        
        document.getElementById('sync-info').innerHTML = `
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>
          Última atualização: <strong>${data.ultima_atualizacao}</strong> (${data.total} matérias)
        `;
        renderizar(todasMaterias);
      } catch (err) {
        document.getElementById('lista-materias').innerHTML = `
          <div class="p-6 bg-red-50 text-red-700 rounded-xl border border-red-200 text-sm">
            Erro ao carregar dados. Verifique se o arquivo dados_materias.json foi gerado.
          </div>`;
      }
    }

    function renderizar(materias) {
      const container = document.getElementById('lista-materias');
      if (materias.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400">Nenhuma matéria encontrada.</div>';
        return;
      }

      container.innerHTML = materias.map(m => `
        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow transition-shadow">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h3 class="font-bold text-slate-900 text-base">
              ${m.titulo}
            </h3>
            <span class="inline-flex self-start sm:self-auto text-xs font-medium px-2.5 py-1 rounded-full ${
              m.status.toLowerCase().includes('aprovad') ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
            }">
              ${m.status}
            </span>
          </div>

          <p class="text-sm text-slate-600 mt-2">${m.ementa}</p>

          <div class="flex flex-wrap items-center gap-4 text-xs text-slate-400 mt-4 pt-3 border-t border-slate-100">
            <span><strong>Autor:</strong> ${m.autor}</span>
            <span><strong>Data:</strong> ${m.data || 'N/A'}</span>
            ${m.link_original ? `<a href="${m.link_original}" target="_blank" class="text-blue-600 hover:underline ml-auto font-medium">Ver no site oficial &rarr;</a>` : ''}
          </div>

          ${m.tramitacoes && m.tramitacoes.length > 0 ? `
            <div class="mt-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
              <span class="text-xs font-semibold text-slate-700 uppercase tracking-wider block mb-2">Linha do Tempo / Despachos</span>
              <ul class="space-y-1.5 text-xs text-slate-600">
                ${m.tramitacoes.map(t => `
                  <li class="flex items-start gap-2">
                    <span class="text-slate-400 font-mono">${t.data}:</span>
                    <span>${t.despacho} <span class="text-slate-400">(${t.unidade})</span></span>
                  </li>
                `).join('')}
              </ul>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // Eventos de Filtro
    document.getElementById('busca').addEventListener('input', (e) => {
      const termo = e.target.value.toLowerCase();
      const filtradas = todasMaterias.filter(m => 
        m.titulo.toLowerCase().includes(termo) || 
        m.ementa.toLowerCase().includes(termo) || 
        m.autor.toLowerCase().includes(termo)
      );
      renderizar(filtradas);
    });

    carregarDados();
  </script>
</body>
</html>
